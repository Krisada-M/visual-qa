name: visual-qa-v1

on:
  push:
    branches: ['feat/visual-qa-*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec vitest run packages/uimatch-core/src/adapters/playwright/route-guard.test.ts packages/uimatch-cli/src/commands/figma-png-bypass.test.ts packages/uimatch-cli/src/visual-qa/contract.test.ts packages/uimatch-cli/src/visual-qa/auth.test.ts packages/uimatch-cli/src/visual-qa/suite-core.test.ts packages/uimatch-cli/src/visual-qa/mapping.test.ts
      - run: pnpm exec tsx experiments/visual-qa/smoke.ts
        env:
          UIMATCH_CHROME_CHANNEL: chrome
          UIMATCH_CHROMIUM_SANDBOX: 'true'
      - run: pnpm exec tsx experiments/visual-qa/auth-smoke.ts
        env:
          UIMATCH_CHROME_CHANNEL: chrome
          UIMATCH_CHROMIUM_SANDBOX: 'true'
      - name: OMP command integration smoke
        run: node integrations/omp/extension/smoke.mjs
      - name: Verify mapping suggestions
        run: pnpm exec tsx packages/uimatch-cli/src/visual-qa/mapping-suggest.ts experiments/visual-qa/mapping-index.example.json
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm exec prettier --check packages/uimatch-core/src/adapters/playwright.ts packages/uimatch-core/src/adapters/browser-pool.ts packages/uimatch-core/src/adapters/playwright/route-guard.ts packages/uimatch-core/src/adapters/playwright/route-guard.test.ts packages/uimatch-cli/src/commands/compare.ts packages/uimatch-cli/src/commands/figma-png-bypass.ts packages/uimatch-cli/src/commands/figma-png-bypass.test.ts packages/uimatch-cli/src/visual-qa experiments/visual-qa integrations/omp
      - name: Collect formatting fixes
        if: failure()
        run: |
          pnpm exec prettier --write packages/uimatch-core/src/adapters/playwright.ts packages/uimatch-core/src/adapters/browser-pool.ts packages/uimatch-core/src/adapters/playwright/route-guard.ts packages/uimatch-core/src/adapters/playwright/route-guard.test.ts packages/uimatch-cli/src/commands/compare.ts packages/uimatch-cli/src/commands/figma-png-bypass.ts packages/uimatch-cli/src/commands/figma-png-bypass.test.ts packages/uimatch-cli/src/visual-qa experiments/visual-qa integrations/omp
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const changed = cp.execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          for (const path of changed) console.log('FORMAT_BLOB|' + path + '|' + fs.readFileSync(path).toString('base64'));
          NODE
